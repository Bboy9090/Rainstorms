name: Story Bench Self-Contained Android Test APK

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-debug-apk.yml'
      - 'docs/release/STORY_BENCH_ANDROID_TEST_APK.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-test-apk:
    name: Build self-contained QA APK (development signed, not Play submission)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_BACKEND_URL: https://rainstormsbackend.up.railway.app
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clean locked dependency install
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit
      - name: Generate Android project from current Expo 58 source
        run: npx expo prebuild --platform android --clean --non-interactive
        env:
          EXPO_PUBLIC_BACKEND_URL: https://rainstormsbackend.up.railway.app
      - name: Build and verify self-contained QA APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease --stacktrace
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$APKANALYZER"
          test "$("$APKANALYZER" manifest application-id "$APK")" = 'com.rainstorms.app'
          test "$("$APKANALYZER" manifest target-sdk "$APK")" = '36'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKANALYZER" files list "$APK" | grep -qx '/assets/index.android.bundle'
          "$APKSIGNER" verify --print-certs "$APK" > app/build/outputs/apk/release/APK-SIGNATURE.txt
          sha256sum "$APK" > app/build/outputs/apk/release/APK-SHA256.txt
          printf 'candidate_sha=%s\nartifact_type=SELF_CONTAINED_QA_SIDELOAD\npackage=com.rainstorms.app\ntarget_sdk=36\njs_bundle_embedded=true\nplay_store_signed=false\n' \
            "$(git rev-parse HEAD)" > app/build/outputs/apk/release/APK-QUALIFICATION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BobbysStoryBench-self-contained-QA-APK
          path: |
            frontend/android/app/build/outputs/apk/release/app-release.apk
            frontend/android/app/build/outputs/apk/release/APK-SHA256.txt
            frontend/android/app/build/outputs/apk/release/APK-SIGNATURE.txt
            frontend/android/app/build/outputs/apk/release/APK-QUALIFICATION.txt
          if-no-files-found: error
          retention-days: 30
