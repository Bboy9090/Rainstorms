name: Android Production Signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-aab:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify signing inputs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Generate Android project
        env:
          EXPO_PUBLIC_BACKEND_URL: https://rainstormsbackend.up.railway.app
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Assert Google Play API 36 target
        run: |
          set -euo pipefail
          grep -R -E 'compileSdkVersion.*36|compileSdk.*36' android | head -20
          grep -R -E 'targetSdkVersion.*36|targetSdk.*36' android | head -20

      - name: Install upload keystore and release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/rainstorms-upload.jks
          {
            printf 'storeFile=rainstorms-upload.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties
          python3 scripts/configure_android_release_signing.py

      - name: Build and verify signed AAB
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          sha256sum "$AAB" > app/build/outputs/bundle/release/AAB-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rainstorms-android-aab-signed
          path: |
            frontend/android/app/build/outputs/bundle/release/app-release.aab
            frontend/android/app/build/outputs/bundle/release/AAB-SHA256.txt
          if-no-files-found: error
          retention-days: 30
