name: Fan-Favorite Foundation

on:
  pull_request:
  push:
    branches:
      - main
      - polish/fan-favorite-foundation

permissions:
  contents: read

concurrency:
  group: rainstorms-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend format, lint, typecheck, and export
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee frontend-install.log

      - name: Check formatting
        id: format
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run format:check:js 2>&1 | tee frontend-format.log

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint:js 2>&1 | tee frontend-lint.log

      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck:js 2>&1 | tee frontend-typecheck.log

      - name: Export web build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          EXPO_NO_TELEMETRY: "1"
        run: |
          set -o pipefail
          npm run build:js 2>&1 | tee frontend-build.log

      - name: Record frontend outcomes
        if: always()
        shell: bash
        run: |
          printf '%s\n' \
            "install_outcome=${{ steps.install.outcome }}" \
            "format_outcome=${{ steps.format.outcome }}" \
            "lint_outcome=${{ steps.lint.outcome }}" \
            "typecheck_outcome=${{ steps.typecheck.outcome }}" \
            "build_outcome=${{ steps.build.outcome }}" \
            > frontend-outcomes.txt

      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rainstorms-frontend-foundation
          path: |
            frontend-install.log
            frontend-format.log
            frontend-lint.log
            frontend-typecheck.log
            frontend-build.log
            frontend-outcomes.txt
            frontend/dist
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce frontend gate
        if: always()
        shell: bash
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.format.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"

  backend:
    name: Backend format, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install locked backend dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee backend-install.log
          python -m pip install -r backend/requirements.txt 2>&1 | tee -a backend-install.log

      - name: Check Black formatting
        id: format
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run format:check:py 2>&1 | tee backend-format.log

      - name: Run flake8
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint:py 2>&1 | tee backend-lint.log

      - name: Run pytest
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          npm run test:py 2>&1 | tee backend-tests.log

      - name: Record backend outcomes
        if: always()
        shell: bash
        run: |
          printf '%s\n' \
            "install_outcome=${{ steps.install.outcome }}" \
            "format_outcome=${{ steps.format.outcome }}" \
            "lint_outcome=${{ steps.lint.outcome }}" \
            "tests_outcome=${{ steps.tests.outcome }}" \
            > backend-outcomes.txt

      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rainstorms-backend-foundation
          path: |
            backend-install.log
            backend-format.log
            backend-lint.log
            backend-tests.log
            backend-outcomes.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce backend gate
        if: always()
        shell: bash
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.format.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
